[project]
name = "quarkdock-api"
version = "0.1.0"
description = "High-efficiency async FastAPI backend engine for QuarkDock with Ollama and Langfuse"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "QuarkDock Contributors", email = "aparv111@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "orjson>=3.10.7",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "httpx[http2]>=0.27.2",
    "redis[hiredis]>=5.0.8",
    "packaging>=24.0",
    "langfuse>=2.50.0,<3.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "opentelemetry-exporter-otlp>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.3",
    "mypy>=1.11.2",
    "types-redis>=4.6.0.20240425",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "PERF",   # Perflint (Rule 09 enforcement)
    "RUF",    # Ruff-specific rules
]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
