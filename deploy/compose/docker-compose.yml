# ==============================================================================
# ⚛️ QuarkDock Multi-Service Container Orchestration
# ==============================================================================
# Hardware Budget: Tuned for Apple Silicon (MacBook M5 Pro 24GB Unified Memory)
# Total Eco-Cap: ~8.6 GB Max under load (Comfortably within 12-14 GB Docker VM)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Local LLM Engine (Ollama)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: quarkdock-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 6.0G
        reservations:
          memory: 4.0G
    networks:
      - quarkdock-net

  # ----------------------------------------------------------------------------
  # 2. Database for Langfuse (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: quarkdock-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quarkdock_postgres_secret}
      POSTGRES_DB: ${POSTGRES_DB:-langfuse}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - quarkdock-net

  # ----------------------------------------------------------------------------
  # 3. Session & Rate Limiting Cache (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: quarkdock-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - quarkdock-net

  # ----------------------------------------------------------------------------
  # 4. Observability & Tracing Platform (Langfuse v2 - Postgres Native)
  # ----------------------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2
    container_name: quarkdock-langfuse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:quarkdock_postgres_secret@postgres:5432/langfuse}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-quarkdock_nextauth_secret_minimum_32_chars_apple_silicon_m5}
      SALT: ${SALT:-quarkdock_salt_secure_random_seed_12345678}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.0G
        reservations:
          memory: 512M
    networks:
      - quarkdock-net


  # ----------------------------------------------------------------------------
  # 6. High-Efficiency FastAPI Backend Engine
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: quarkdock-api
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_ENV=development
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-quarkdock-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-quarkdock-local}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - quarkdock-net

  # ----------------------------------------------------------------------------
  # 7. Glassmorphic React 19 Chat UI
  # ----------------------------------------------------------------------------
  ui:
    build:
      context: ../../services/ui
      dockerfile: Dockerfile
    container_name: quarkdock-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:3000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - quarkdock-net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  ollama_data:
    name: quarkdock_ollama_data
  pg_data:
    name: quarkdock_pg_data
  redis_data:
    name: quarkdock_redis_data

# ------------------------------------------------------------------------------
# Bridge Network
# ------------------------------------------------------------------------------
networks:
  quarkdock-net:
    name: quarkdock-net
    driver: bridge
